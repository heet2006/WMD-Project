version: '3.8'

services:
  # Python Decision Tree ML Service
  ml-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ml
    container_name: edupredict_ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Spring Boot REST API Backend
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: edupredict_backend
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      ml-service:
        condition: service_healthy

  # React Frontend Dashboard
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: edupredict_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
